---
- summary: |
    При смене языка на сайте частично остаётся на старом языке
  environment: |
    Opera 139.0.6053.63 (Официальная сборка) (64 бит)
    Windows 11 25H2 · 26200.7840
  steps-to-reproduce: |
    1. Открыть сайт интернет‑магазина в Opera
    2. В блоке выбора языка (в шапке) кликнуть «Russian»
    3. Дождаться полной загрузки страницы
    4.Прокрутить страницу, открыть корзину
  expected-result: >
    Весь интерфейс (кнопки, заголовки, категории, описание, валюта)
    отображается на русском языке; 

    Все динамические блоки (корзина) тоже локализованы; 

    После перезагрузки страницы язык сохраняется (если включена привязка к сессии/кукам)
  actual-result: >
    Названия, описания, подкатегории, заголовок, валюта продуктов не
    поменяли языка   

    Основные кнопки изменили язык на русский

    После перезагрузки страницы язык меняется на английский

- summary: |
    При оформлении заказа товары из корзины не удаляются
  environment: |
    Opera 139.0.6053.63 (Официальная сборка) (64 бит)
    Windows 11 25H2 · 26200.7840
  steps-to-reproduce: |
    1. Добавить 2 товара в корзину
    2. Оформить заказ (успешно, статус «Принят»)
    3. Вернуться на страницу корзины
  expected-result: |
    Корзина пуста; счётчик = 0; тост «Заказ оформлен, корзина очищена»
  actual-result: |
    Товары остаются в корзине; счётчик не сбрасывается

- summary: |
    Возможность оформить заказ на товар с нулевым остатком
  environment: |
    Opera 139.0.6053.63 (Официальная сборка) (64 бит)
    Windows 11 25H2 · 26200.7840
  steps-to-reproduce: |
    1. Найти товар «Sportbike Motorcycle» через поиск или каталог.
    2. Убедиться, что в карточке указано остаток равен 0
    3. Нажать «В корзину»
    4. Перейти в корзину и нажать «Оформить заказ»
  expected-result: >
    Товар нельзя добавить в корзину при остатке 0

    Если пользователь каким‑то образом попал на старую версию карточки, где кнопка активна, при попытке добавления система должна блокировать действие и показывать сообщение: «Товар закончился. Выберите аналог или подпишитесь на уведомление»

    Заказ с таким товаром не создаётся
  actual-result: |
    Товар успешно добавляется в корзину
    В корзине отображается корректная цена, кнопка «Оформить заказ» активна
    Заказ создаётся со статусом «Принят», в детализации заказа числится 1 шт






















