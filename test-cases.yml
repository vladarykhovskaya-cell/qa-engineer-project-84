---
- summary: |
    Поиск по точному названию товара
  requirement: >
    Пользователь должен иметь возможность искать товары по ключевому
    слову или категории
  prerequisites: |
    Товар с известным названием есть в каталоге
  test-data: |
    Red Nail Polish
  steps:
    - В строке поиска ввести точное название товара
    - Нажать Enter или кнопку поиска
  expected-result: |
    В результатах отображается искомый товар
    
- summary: |
    Поиск с опечаткой товара
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому
    слову или категории
  prerequisites: 
     Есть товар с названием, близким к запросу с опечаткой
  test-data: |
    Ipone 6
  steps:
    - Ввести название с 1–2 опечатками
    - Выполнить поиск
  expected-result: >
    Cистема либо исправляет опечатку и показывает релевантные
    товары, либо выдаёт результаты, максимально близкие к запросу

- summary: |
    Применение фильтра по категории и цене
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    В каталоге есть товары разных категорий и ценовых диапазонов
  test-data: |
    Smartphones
  steps:
    - Перейти в категорию "Smartphones"
    - Установить фильтр «Цена:500 до 7140$"
    - Применить фильтры
  expected-result: >
    Отображаются только товары из категории «Smartphones» в
    указанном ценовом диапазоне, корректно показывается количество найденных
    товаров

- summary: |
    Просмотр описания товара
  requirement: >
    Пользователь должен иметь возможность просматривать товары и
    просматривать подробную информацию о товаре
  prerequisites: |
    Ко всем товарам представлено описание товара
  test-data: |
    Открыта страница интернет магазина
  steps:
    - Нажимаем на карточку товара
  expected-result: |
    Отображается картинка товара, его и стоимость и описание товара 

- summary: |
    Добавление товара в корзину
  requirement: >
    Пользователь должен иметь возможность добавлять товары в корзину и
    просматривать содержимое корзины
  prerequisites: |
    Корзина пуста, товар в наличии
  test-data: |
    Открыт каталог товаров
  steps:
    - На странице товара нажать «Добавить в корзину»
  expected-result: |
    Счётчик корзины в шапке увеличивается, товар появляется в корзине

- summary: |
    Адаптивность на мобильном устройстве
  requirement: |
    Сайт должен иметь мобильную версию
  prerequisites: |
    Сайт открыт на "DevTools" мобильного устройства (375×667 px)
  test-data: |
    "DevTools" мобильного устройства (375×667 px)
  steps:
    - Каталог
    - Товар
    - Корзина
    - Оформление
  expected-result: >
    Все элементы читаемы, кнопки нажимаются, нет горизонтальной
    прокрутки, поля ввода корректно работают

- summary: |
    Сохранность корзины при обрыве соединения
  requirement: |
    Корзина в оффлайн не должна быть пустой 
  prerequisites: |
    Авторизованный пользователь; корзина пуста; инструменты для эмуляции сети
  test-data: |
    DevTools → Offline, режим Flight Mode
  steps:
    - Добавить в корзину 2 разных товара
    - Включить режим Offline в DevTools
    - Обновить страницу корзины
    - Выключить Offline, обновить страницу ещё раз
  expected-result: >
    В оффлайн корзина не пустеет, либо показано сообщение «Нет
    соединения, повторите позже» — но без потери товаров; после восстановления
    сети корзина содержит оба товара, дублей нет

- summary: |
    Кроссбраузерность оформления заказа
  requirement: |
    Пользователь может пользоваться интернет-магазином в любом браузере
  prerequisites: 
    Установлены актуальные версии
  test-data: |
    Chrome, Firefox, Safari, Edge, Opera
  steps:
    - В каждом браузере войти под тестовым аккаунтом
    - Пройти полный путь оформления заказа
    - Проверить консоль разработчика на каждой странице
  expected-result: >
    Во всех браузерах шаги выполняются одинаково, визуальных
    расхождений, ломающих использование нет

- summary: |
    Одновременный вход с двух устройств и синхронизация корзины
  requirement: >
    Пользователь может пользоваться интернет-магазином сразу на
    нескольких устройствах 
  prerequisites: |
    Один аккаунт
  test-data: |
    Браузер на ПК и браузер на телефоне
  steps:
    - Добавить товар А в корзину на ПК
    - Добавить товар Б в корзину на телефоне
    - Обновить корзину на обоих устройствах
  expected-result: |
    Корзина синхронизирована: на обоих устройствах видны А и Б; нет дублей

- summary: |
    Добавление в корзину товара с нулевым остатком
  requirement: |
    Пользователь не может добавлять товар в корзину у которого на остатке 0
  prerequisites: Карточка видна
  test-data: |
    Остаток товара = 0
  steps:
    - На карточке нажать «Добавить в корзину»
  expected-result: >
    Всплывает сообщение «Товар закончился», добавление блокируется,
    кнопка становится неактивной

























    
